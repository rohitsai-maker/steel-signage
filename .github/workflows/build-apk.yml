# Builds the Android TV APK on every push and publishes it as a GitHub Release.
# Permanent download link (always the newest build):
#   https://github.com/rohitsai-maker/steel-signage/releases/latest/download/SteelSignage-TV.apk
name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", "branding/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare signing key (created once, then reused so TV updates install)
        run: |
          if [ ! -f android/signing/steel.jks ]; then
            mkdir -p android/signing
            keytool -genkeypair -keystore android/signing/steel.jks -storetype PKCS12 -alias steel \
              -keyalg RSA -keysize 2048 -validity 36500 -storepass steelsignage -keypass steelsignage \
              -dname "CN=Steel Signage, O=Steel Personal Training, L=Hyderabad, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/signing/steel.jks
            git commit -m "Add fixed app signing key [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - name: Apply branding (logo -> app icon + TV banner)
        run: |
          SRC=$(ls branding/*.png branding/*.jpg branding/*.jpeg 2>/dev/null | head -1 || true)
          if [ -n "$SRC" ]; then
            command -v convert >/dev/null || (sudo apt-get update -y && sudo apt-get install -y imagemagick)
            RES=android/app/src/main/res
            rm -f $RES/drawable/ic_launcher.xml $RES/drawable/banner.xml
            mkdir -p $RES/drawable-nodpi
            BG=$(convert "$SRC" -format '#%[hex:p{2,2}]' info: | cut -c1-7)
            convert "$SRC" -resize 512x512 $RES/drawable-nodpi/ic_launcher.png
            convert "$SRC" -fuzz 12% -trim +repage -resize 560x290 -background "$BG" -gravity center -extent 640x360 $RES/drawable-nodpi/banner.png
            echo "Branding applied from $SRC (background $BG)"
          else
            echo "No logo in branding/ - using default icon"
          fi
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/*.apk SteelSignage-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SteelSignage-TV-apk
          path: SteelSignage-TV.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Steel Signage TV v0.1.${{ github.run_number }}
          make_latest: true
          body: |
            Android TV / TV box / Fire TV player for Steel Signage.
            Install: download SteelSignage-TV.apk and sideload it (adb install, USB stick, or the Downloader app).
          files: SteelSignage-TV.apk
